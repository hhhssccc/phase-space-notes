<div id="grover-counting-qiga2">
  <h3>只问：试着填 0，这一半还有解吗？</h3>
  <div class="viz-controls">
    <label class="form-label">例子
      <select class="form-select" id="gc-example">
        <option value="single">单解示例</option>
        <option value="multiple">多解示例</option>
      </select>
    </label>
    <label class="form-label" for="gc-step">回看步骤 <span id="gc-step-value" class="tabular-nums">3 / 3</span>
      <input class="form-range" id="gc-step" type="range" min="0" max="3" step="1" value="3">
    </label>
  </div>
  <div class="text-small text-muted">按首位开始展示；论文从末位开始，算法相同。</div>
  <div id="gc-tree"></div>
  <div class="gc-detail" aria-live="polite">
    <div id="gc-current"></div>
    <div id="gc-values" class="tabular-nums"></div>
    <div id="gc-decision"></div>
  </div>
  <div class="text-small text-muted gc-note">着色：保留路径；S₀：实际试算的 0 分支；灰色：未访问。</div>
  <div class="text-small gc-cost">本图枚举八个候选演示计数；实际闭合模拟的成本取决于电路。</div>
  <div id="gc-cost-count" class="text-small text-muted tabular-nums"></div>
</div>
<style>
  #grover-counting-qiga2 { color:var(--foreground); width:100%; min-width:0; }
  #grover-counting-qiga2 h3 { padding-right:90px; }
  #grover-counting-qiga2 .gc-tree-svg { display:block; width:100%; overflow:visible; }
  #grover-counting-qiga2 .gc-tree-svg text { fill:var(--foreground); font-size:12px; font-weight:400; }
  #grover-counting-qiga2 .gc-tree-svg .gc-edge { stroke:var(--border); stroke-width:1.5; fill:none; }
  #grover-counting-qiga2 .gc-tree-svg .gc-edge-kept { stroke:var(--viz-series-1); stroke-width:2.5; }
  #grover-counting-qiga2 .gc-tree-svg .gc-node { fill:var(--muted); }
  #grover-counting-qiga2 .gc-tree-svg .gc-node-kept { fill:color-mix(in srgb,var(--viz-series-1) 20%,var(--background)); }
  #grover-counting-qiga2 .gc-tree-svg .gc-node-tested { fill:color-mix(in srgb,var(--foreground) 9%,var(--background)); }
  #grover-counting-qiga2 .gc-tree-svg .gc-unvisited { fill:var(--muted-foreground); }
  #grover-counting-qiga2 .gc-tree-svg .gc-count { fill:var(--foreground); }
  #grover-counting-qiga2 .gc-detail { display:grid; gap:4px; margin-top:6px; overflow-wrap:anywhere; }
  #grover-counting-qiga2 .gc-note { margin-top:12px; }
  #grover-counting-qiga2 .gc-cost { margin-top:8px; }
  @media (max-width:420px) {
    #grover-counting-qiga2 h3 { padding-right:0; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('grover-counting-qiga2');
  const choice = root.querySelector('#gc-example');
  const slider = root.querySelector('#gc-step');
  const stepValue = root.querySelector('#gc-step-value');
  const tree = root.querySelector('#gc-tree');
  const current = root.querySelector('#gc-current');
  const values = root.querySelector('#gc-values');
  const decision = root.querySelector('#gc-decision');
  const costCount = root.querySelector('#gc-cost-count');
  const sets = { single:['101'], multiple:['010','101','111'] };
  const ns = 'http://www.w3.org/2000/svg';
  let state = { example:'single', step:3 };

  function restore(snapshot) {
    const saved = snapshot && (snapshot.privateContent || snapshot.modelContent);
    if (!saved || saved.version !== 1) return;
    if (saved.example === 'single' || saved.example === 'multiple') state.example = saved.example;
    if (Number.isInteger(saved.step) && saved.step >= 0 && saved.step <= 3) state.step = saved.step;
  }

  function route() {
    const solutions = sets[state.example];
    const steps = [];
    let prefix = '';
    let total = solutions.length;
    for (let k = 0; k < 3; k++) {
      const trial = prefix + '0';
      const zeros = solutions.filter(s => s.startsWith(trial)).length;
      const kept = zeros > 0 ? trial : prefix + '1';
      const keptCount = zeros > 0 ? zeros : total - zeros;
      steps.push({ prefix, total, trial, zeros, kept, keptCount, dimension:2 ** (2-k) });
      prefix = kept;
      total = keptCount;
    }
    return { solutions, steps };
  }

  function add(parent, tag, attributes, text) {
    const el = document.createElementNS(ns, tag);
    for (const [key,value] of Object.entries(attributes || {})) el.setAttribute(key,String(value));
    if (text !== undefined) el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  function position(prefix,width) {
    if (!prefix) return { x:width/2, y:30 };
    const depth = prefix.length;
    const index = parseInt(prefix,2);
    return { x:(index+0.5)*width/(2**depth), y:30+depth*82 };
  }

  function fraction(num,den) {
    if (num === 0) return '0';
    let a=num,b=den;
    while (b) { const t=b; b=a%b; a=t; }
    return den/a === 1 ? String(num/a) : `${num/a}/${den/a}`;
  }

  function render() {
    const data = route();
    const seen = data.steps.slice(0,state.step);
    const kept = new Set(['',...seen.map(s => s.kept)]);
    const tested = new Map(seen.map(s => [s.trial,s.zeros]));
    const width = Math.max(280,Math.floor(tree.getBoundingClientRect().width || root.getBoundingClientRect().width || 600));
    tree.replaceChildren();
    const svg = add(tree,'svg',{ class:'gc-tree-svg', viewBox:`0 0 ${width} 322`, height:322, role:'img', 'aria-labelledby':'gc-tree-title gc-tree-desc' });
    add(svg,'title',{ id:'gc-tree-title' },'三比特候选的逐位计数树');
    const visiblePrefix = state.step === 0 ? '空前缀' : data.steps[state.step-1].kept;
    add(svg,'desc',{ id:'gc-tree-desc' },`总解数${data.solutions.length}。当前第${state.step}步，保留${visiblePrefix}。每步只精确计算试填0的分支解数；其他分支由已知父节点总数判断。`);
    for (let depth=1;depth<=3;depth++) {
      for (let i=0;i<2**depth;i++) {
        const prefix=i.toString(2).padStart(depth,'0');
        const p=position(prefix.slice(0,-1),width), q=position(prefix,width);
        add(svg,'line',{ x1:p.x,y1:p.y+13,x2:q.x,y2:q.y-13,class:`gc-edge${kept.has(prefix) ? ' gc-edge-kept' : ''}` });
      }
    }
    for (let depth=0;depth<=3;depth++) {
      for (let i=0;i<2**depth;i++) {
        const prefix=depth ? i.toString(2).padStart(depth,'0') : '';
        const p=position(prefix,width);
        const w=depth===0 ? 64 : depth===3 ? 34 : 28;
        const nodeClass=kept.has(prefix) ? ' gc-node-kept' : tested.has(prefix) ? ' gc-node-tested' : '';
        add(svg,'rect',{ x:p.x-w/2,y:p.y-13,width:w,height:26,rx:5,class:`gc-node${nodeClass}` });
        add(svg,'text',{ x:p.x,y:p.y+4,'text-anchor':'middle',class:(!kept.has(prefix)&&!tested.has(prefix)) ? 'gc-unvisited' : '' },prefix || '全部 8');
        if (depth===0) add(svg,'text',{ x:p.x,y:p.y+32,'text-anchor':'middle',class:'gc-count' },`总 S=${data.solutions.length}`);
        else if (tested.has(prefix)) add(svg,'text',{ x:p.x,y:p.y+32,'text-anchor':'middle',class:'gc-count' },`S₀=${tested.get(prefix)}`);
      }
    }
    choice.value=state.example;
    slider.value=String(state.step);
    stepValue.textContent=`${state.step} / 3`;
    if (state.step===0) {
      current.textContent='开始：尚未固定任何候选位';
      values.textContent=`候选数 D=8；总解数 S=${data.solutions.length}；精确振幅 A=${fraction(data.solutions.length,8)}`;
      decision.textContent='总数已确认非零，可以逐位保留一个仍有解的分支。';
    } else {
      const s=data.steps[state.step-1];
      current.textContent=`第 ${state.step} 位：前缀 ${s.prefix || '∅'} → 试 ${s.trial}`;
      values.textContent=`候选数 D=${s.dimension}；试算解数 S₀=${s.zeros}；精确振幅 A₀=${fraction(s.zeros,s.dimension)}`;
      const reason=s.zeros>0 ? '试 0 后仍有解' : `试 0 无解，另一半有 ${s.total}−0=${s.keptCount} 个解`;
      decision.textContent=`保留 ${s.kept}：${reason}${state.step===3 ? '；得到一个答案。' : '。'}`;
    }
    costCount.textContent=`已计算 ${state.step+1} 个精确振幅（总数 1 次＋试 0 分支 ${state.step} 次）。`;
  }

  function save() {
    if (!window.openai || typeof window.openai.setWidgetState!=='function') return;
    const data=route();
    const prefix=state.step ? data.steps[state.step-1].kept : '';
    window.openai.setWidgetState({
      modelContent:{ version:1,example:state.example,step:state.step,prefix,found:state.step===3 },
      privateContent:{ version:1,example:state.example,step:state.step }
    }).catch(() => {});
  }

  choice.addEventListener('change',() => { state.example=choice.value; render(); save(); });
  slider.addEventListener('input',() => { state.step=Number(slider.value); render(); save(); });
  window.addEventListener('openai:set_globals',event => {
    const snapshot=event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (snapshot) { restore(snapshot); render(); }
  });
  restore(window.openai && window.openai.widgetState);
  render();
  const resizeObserver=new ResizeObserver(() => render());
  resizeObserver.observe(tree);
})();
</script>
