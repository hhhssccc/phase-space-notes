<div id="grover-noise-lesson">
  <style>
    #grover-noise-lesson { position: relative; color: var(--foreground); }
    #grover-noise-lesson h3 { padding-right: 94px; }
    #grover-noise-lesson .noise-controls { margin-top: 16px; }
    #grover-noise-lesson .noise-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 8px; }
    #grover-noise-lesson .noise-series { display: inline-flex; align-items: center; gap: 7px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--foreground); font: inherit; font-weight: 400; }
    #grover-noise-lesson .noise-series[aria-pressed="false"] { opacity: .45; }
    #grover-noise-lesson .noise-swatch { display: inline-block; width: 24px; height: 0; border-top: 2px solid var(--viz-series-1); }
    #grover-noise-lesson .noise-swatch.ideal { border-top-style: dashed; border-top-color: var(--viz-series-2); }
    #grover-noise-lesson .noise-plot { width: 100%; min-width: 0; }
    #grover-noise-lesson .noise-chart { display: block; width: 100%; overflow: visible; }
    #grover-noise-lesson .noise-chart text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #grover-noise-lesson .noise-chart .domain { display: none; }
    #grover-noise-lesson .noise-chart .tick line { stroke: var(--border); }
    #grover-noise-lesson .noise-live { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 2px; }
    #grover-noise-lesson .noise-tooltip { position: absolute; pointer-events: none; z-index: 5; background: var(--popover); color: var(--popover-foreground); max-width: calc(100% - 16px); }
    #grover-noise-lesson .noise-tooltip-row { display: flex; justify-content: space-between; gap: 18px; }
    #grover-noise-lesson .noise-tooltip [data-tooltip-heading] { margin-bottom: 5px; }
    @media (pointer: coarse) {
      #grover-noise-lesson .noise-series { min-height: 44px; }
    }
  </style>
  <h3>每轮全局去极化：Grover 成功率</h3>
  <div class="viz-controls noise-controls">
    <label class="form-label" for="grover-noise-n">比特数 n：<output id="grover-noise-n-value" class="tabular-nums">30</output>
      <input id="grover-noise-n" class="form-range" type="range" min="4" max="30" step="1" value="30">
    </label>
    <label class="form-label" for="grover-noise-lambda">每轮噪声 λ：<output id="grover-noise-lambda-value" class="tabular-nums">10⁻⁴</output>
      <input id="grover-noise-lambda" class="form-range" type="range" min="-7" max="-2" step="0.05" value="-4" aria-label="每轮噪声强度，对数刻度">
    </label>
  </div>
  <label class="form-check form-switch">
    <input id="grover-noise-off" class="form-check-input" type="checkbox">
    <span class="form-check-label">无噪声</span>
  </label>
  <div class="noise-legend" aria-label="显示的曲线">
    <button type="button" class="noise-series cursor-interaction" data-series="ideal" aria-pressed="true"><span class="noise-swatch ideal" aria-hidden="true"></span>理想</button>
    <button type="button" class="noise-series cursor-interaction" data-series="noisy" aria-pressed="true"><span class="noise-swatch" aria-hidden="true"></span>有噪声</button>
  </div>
  <div class="noise-plot">
    <svg class="noise-chart" role="img" aria-labelledby="grover-noise-title grover-noise-description">
      <title id="grover-noise-title">理想与含全局去极化噪声的 Grover 成功率</title>
      <desc id="grover-noise-description">唯一解。横轴为整数 Grover 轮数除以理想首峰轮数，纵轴为找到解的概率。噪声模型包含均匀分布回填项。点击图内可固定两条曲线的对照数值。</desc>
    </svg>
  </div>
  <div class="noise-live text-small tabular-nums" aria-live="polite">
    <span data-r-value></span><span data-ideal-value></span><span data-noisy-value></span>
  </div>
  <div class="tooltip noise-tooltip" role="tooltip" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('grover-noise-lesson');
  if (!root || typeof d3 === 'undefined') return;
  const inputN = root.querySelector('#grover-noise-n');
  const inputLambda = root.querySelector('#grover-noise-lambda');
  const inputOff = root.querySelector('#grover-noise-off');
  const outputN = root.querySelector('#grover-noise-n-value');
  const outputLambda = root.querySelector('#grover-noise-lambda-value');
  const plot = root.querySelector('.noise-plot');
  const svg = d3.select(root.querySelector('.noise-chart'));
  const tooltip = root.querySelector('.noise-tooltip');
  const state = { n: 30, logLambda: -4, noiseOff: false, showIdeal: true, showNoisy: true };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const series = [
    { key: 'ideal', name: '理想', field: 'showIdeal', color: 'var(--viz-series-2)', dash: '5 4' },
    { key: 'noisy', name: '有噪声', field: 'showNoisy', color: 'var(--viz-series-1)', dash: null }
  ];
  let values = [], scales, dims, currentR = 1, pinned = false;
  const clip = svg.append('defs').append('clipPath').attr('id', 'grover-noise-clip').append('rect');
  const frame = svg.append('rect').attr('data-chart-frame', '').attr('fill', 'none').attr('stroke', 'var(--border)').attr('stroke-width', 1);
  const grid = svg.append('g').attr('aria-hidden', 'true');
  const xAxis = svg.append('g');
  const yAxis = svg.append('g');
  const xTitle = svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('text-anchor', 'middle').text('轮数 q / 理想首峰轮数 r');
  const yTitle = svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('text-anchor', 'middle').text('成功率');
  const curveGroup = svg.append('g').attr('clip-path', 'url(#grover-noise-clip)');
  const paths = new Map(series.map(item => [item.key, curveGroup.append('path').attr('data-series-line', item.key).attr('fill', 'none').attr('stroke', item.color).attr('stroke-width', 2.4).attr('stroke-dasharray', item.dash)]));
  const hoverGroup = svg.append('g').attr('visibility', 'hidden').attr('aria-hidden', 'true');
  const guide = hoverGroup.append('line').attr('data-chart-hover-guide', '').attr('stroke', 'var(--muted-foreground)').attr('stroke-width', 1);
  const hoverMarkers = new Map(series.map(item => [item.key, hoverGroup.append('circle').attr('data-chart-hover-marker', item.key).attr('r', 3.5).attr('fill', item.color)]));
  const overlay = svg.append('rect').attr('data-chart-hit', '').attr('data-chart-hover-overlay', 'cross-series').attr('fill', 'transparent');
  const integerFormat = new Intl.NumberFormat('zh-CN');
  const percent = value => value > 0 && value < 0.00001 ? (value * 100).toExponential(2) + '%' : (value * 100).toFixed(value < .01 ? 4 : 2) + '%';
  const scientific = value => {
    const [mantissa, exponent] = value.toExponential(2).split('e');
    const glyphs = { '-': '⁻', '+': '⁺', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
    return mantissa + ' × 10' + [...exponent].map(character => glyphs[character]).join('');
  };
  const lambdaValue = () => state.noiseOff ? 0 : Math.pow(10, state.logLambda);
  const finiteClamp = (value, low, high, fallback) => Number.isFinite(Number(value)) ? Math.max(low, Math.min(high, Number(value))) : fallback;
  function restore(snapshot) {
    if (!snapshot || typeof snapshot !== 'object') return false;
    const saved = snapshot.privateContent;
    if (!saved || saved.kind !== 'grover-noise-v1') return false;
    state.n = Math.round(finiteClamp(saved.n, 4, 30, 30));
    state.logLambda = finiteClamp(saved.logLambda, -7, -2, -4);
    state.noiseOff = saved.noiseOff === true;
    state.showIdeal = saved.showIdeal !== false;
    state.showNoisy = saved.showNoisy !== false;
    return true;
  }
  function persist() {
    if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
    const promise = window.openai.setWidgetState({
      modelContent: { chart: 'Grover 每轮全局去极化模型', n: state.n, lambda: lambdaValue(), idealFirstPeakRounds: currentR },
      privateContent: { kind: 'grover-noise-v1', ...state }
    });
    if (promise && typeof promise.catch === 'function') promise.catch(() => {});
  }
  function clearHover() {
    pinned = false;
    hoverGroup.attr('visibility', 'hidden');
    tooltip.hidden = true;
  }
  function compute() {
    const count = Math.pow(2, state.n);
    const theta = Math.asin(1 / Math.sqrt(count));
    const lambda = lambdaValue();
    currentR = Math.round(Math.PI / (4 * theta) - .5);
    const maxQ = Math.ceil(1.6 * currentR);
    const exact = q => {
      const ideal = Math.pow(Math.sin((2 * q + 1) * theta), 2);
      const survive = lambda === 0 ? 1 : Math.exp(q * Math.log1p(-lambda));
      return { q, x: q / currentR, ideal, noisy: survive * ideal + (1 - survive) / count };
    };
    // Every sampled point is an integer number of Grover rounds; a constant
    // sample count also permits geometry-preserving path transitions.
    values = d3.range(401).map(i => exact(Math.round(maxQ * i / 400)));
    const peakIndex = Math.round(currentR / maxQ * 400);
    values[peakIndex] = exact(currentR);
    values.sort((a, b) => a.q - b.q);
    const atPeak = exact(currentR);
    root.querySelector('[data-r-value]').textContent = '理想首峰 r = ' + integerFormat.format(currentR) + ' 轮';
    root.querySelector('[data-ideal-value]').textContent = '该轮理想成功率 ' + percent(atPeak.ideal);
    root.querySelector('[data-noisy-value]').textContent = '该轮含噪成功率 ' + percent(atPeak.noisy);
    return atPeak;
  }
  function syncControls() {
    inputN.value = state.n;
    inputLambda.value = state.logLambda;
    inputLambda.disabled = state.noiseOff;
    inputOff.checked = state.noiseOff;
    outputN.textContent = state.n;
    outputLambda.textContent = state.noiseOff ? '0' : scientific(lambdaValue());
    inputLambda.setAttribute('aria-valuetext', lambdaValue().toExponential(2));
    root.querySelectorAll('[data-series]').forEach(button => {
      const item = series.find(candidate => candidate.key === button.dataset.series);
      button.setAttribute('aria-pressed', String(state[item.field]));
    });
  }
  function preventLabelCollisions() {
    const labels = [...root.querySelectorAll('.noise-chart .tick text, .noise-chart text.axis-title')];
    const bounds = labels.map(node => ({ node, rect: node.getBoundingClientRect() }));
    // Axis titles are essential; optional x ticks yield first on narrow screens.
    const accepted = bounds.filter(item => item.node.classList.contains('axis-title'));
    for (const item of bounds.filter(entry => !entry.node.classList.contains('axis-title'))) {
      const overlaps = accepted.some(other => item.rect.left < other.rect.right + 4 && item.rect.right + 4 > other.rect.left && item.rect.top < other.rect.bottom + 4 && item.rect.bottom + 4 > other.rect.top);
      if (overlaps && item.node.closest('g') && item.node.closest('g').parentNode === xAxis.node()) item.node.style.visibility = 'hidden';
      else accepted.push(item);
    }
  }
  function draw(animate = false) {
    clearHover();
    syncControls();
    compute();
    const width = Math.max(280, Math.round(plot.getBoundingClientRect().width || 736));
    const height = width < 420 ? 300 : 330;
    dims = { width, height, left: 64, right: width - 14, top: 18, bottom: height - 58 };
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
    const allProbabilities = values.flatMap(point => [point.ideal, point.noisy]).concat([0, 1]);
    const xExtent = d3.extent(values, point => point.x);
    const yExtent = d3.extent(allProbabilities);
    const xPad = (xExtent[1] - xExtent[0]) * .015;
    const yPad = (yExtent[1] - yExtent[0]) * .02;
    const x = d3.scaleLinear().domain([xExtent[0] - xPad, xExtent[1] + xPad]).range([dims.left + 4, dims.right - 4]);
    const y = d3.scaleLinear().domain([yExtent[0] - yPad, yExtent[1] + yPad]).range([dims.bottom - 4, dims.top + 4]);
    scales = { x, y };
    [frame, clip, overlay].forEach(rect => rect.attr('x', dims.left).attr('y', dims.top).attr('width', dims.right - dims.left).attr('height', dims.bottom - dims.top));
    const yTicks = [0, .25, .5, .75, 1];
    grid.selectAll('line').data(yTicks).join('line').attr('x1', dims.left).attr('x2', dims.right).attr('y1', d => y(d)).attr('y2', d => y(d)).attr('stroke', 'var(--border)').attr('stroke-width', .6);
    xAxis.attr('transform', `translate(0,${dims.bottom})`).call(d3.axisBottom(x).tickValues([0, .5, 1, 1.5]).tickFormat(d3.format('.1f')).tickSize(4).tickPadding(7));
    yAxis.attr('transform', `translate(${dims.left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickFormat(d3.format('.0%')).tickSize(4).tickPadding(7));
    xTitle.attr('x', (dims.left + dims.right) / 2).attr('y', height - 10);
    yTitle.attr('transform', `translate(15,${(dims.top + dims.bottom) / 2}) rotate(-90)`);
    for (const item of series) {
      const line = d3.line().x(point => x(point.x)).y(point => y(point[item.key]));
      const path = paths.get(item.key);
      path.interrupt().attr('display', state[item.field] ? null : 'none');
      if (animate && !reducedMotion && path.attr('d')) path.transition().duration(220).attr('d', line(values));
      else path.attr('d', line(values));
    }
    requestAnimationFrame(preventLabelCollisions);
  }
  function hoverAt(event) {
    const raw = d3.pointer(event, svg.node())[0];
    const cursorX = Math.max(scales.x(values[0].x), Math.min(scales.x(values[values.length - 1].x), raw));
    const queryX = scales.x.invert(cursorX);
    const nearestIndex = d3.bisector(point => point.x).center(values, queryX);
    const nearest = values[nearestIndex];
    const leftIndex = nearest.x > queryX ? Math.max(0, nearestIndex - 1) : nearestIndex;
    const rightIndex = nearest.x < queryX ? Math.min(values.length - 1, nearestIndex + 1) : nearestIndex;
    const left = values[leftIndex], right = values[rightIndex];
    const weight = right.x === left.x ? 0 : (queryX - left.x) / (right.x - left.x);
    const shown = series.filter(item => state[item.field]);
    if (!shown.length) { clearHover(); return; }
    hoverGroup.attr('visibility', 'visible');
    guide.attr('x1', cursorX).attr('x2', cursorX).attr('y1', dims.top).attr('y2', dims.bottom);
    tooltip.replaceChildren();
    const heading = document.createElement('div');
    heading.dataset.tooltipHeading = '';
    heading.textContent = 'q ≈ ' + integerFormat.format(Math.round(queryX * currentR)) + '（曲线插值）';
    tooltip.append(heading);
    for (const item of series) {
      const visible = state[item.field];
      const value = left[item.key] + weight * (right[item.key] - left[item.key]);
      hoverMarkers.get(item.key).attr('display', visible ? null : 'none').attr('cx', cursorX).attr('cy', scales.y(value));
      if (visible) {
        const row = document.createElement('div');
        row.className = 'noise-tooltip-row tabular-nums';
        const label = document.createElement('span');
        label.textContent = item.name;
        const number = document.createElement('span');
        number.textContent = percent(value);
        row.append(label, number);
        tooltip.append(row);
      }
    }
    tooltip.hidden = false;
    const rootRect = root.getBoundingClientRect(), svgRect = svg.node().getBoundingClientRect();
    const tooltipWidth = tooltip.offsetWidth;
    const leftPosition = cursorX + svgRect.left - rootRect.left + 10;
    tooltip.style.left = Math.max(8, Math.min(rootRect.width - tooltipWidth - 8, leftPosition)) + 'px';
    tooltip.style.top = svgRect.top - rootRect.top + dims.top + 8 + 'px';
  }
  overlay.on('pointermove', event => { if (!pinned) hoverAt(event); }).on('pointerleave', () => { if (!pinned) { hoverGroup.attr('visibility', 'hidden'); tooltip.hidden = true; } }).on('pointerdown', event => { if (pinned) clearHover(); else { hoverAt(event); pinned = true; } });
  inputN.addEventListener('input', () => { state.n = Number(inputN.value); draw(true); persist(); });
  inputLambda.addEventListener('input', () => { state.logLambda = Number(inputLambda.value); draw(true); persist(); });
  inputOff.addEventListener('change', () => { state.noiseOff = inputOff.checked; draw(true); persist(); });
  root.querySelectorAll('[data-series]').forEach(button => button.addEventListener('click', () => {
    const item = series.find(candidate => candidate.key === button.dataset.series);
    state[item.field] = !state[item.field];
    draw(false);
    persist();
  }));
  restore(window.openai && window.openai.widgetState);
  draw(false);
  let previousWidth = plot.getBoundingClientRect().width;
  new ResizeObserver(entries => {
    const width = entries[0].contentRect.width;
    if (Math.abs(width - previousWidth) > .5) { previousWidth = width; draw(false); }
  }).observe(plot);
  window.addEventListener('openai:set_globals', event => {
    const snapshot = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (restore(snapshot)) draw(false);
  });
})();
</script>
