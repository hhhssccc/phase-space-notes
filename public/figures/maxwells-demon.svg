    <text x="292" y="322" font-size="34">快</text>
    <text x="668" y="322" font-size="34">慢</text>
    <text x="480" y="411" font-size="28">小门</text>
    <text x="300" y="474" font-size="30">左室</text>
    <text x="660" y="474" font-size="30">右室</text>
  </g>
</svg>
